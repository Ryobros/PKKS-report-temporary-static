<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="YAPMI administrative report for 2026–2027.">
    <title>YAPMI Admin Report | 2026–2027</title>
    <link rel="icon" href="./assets/img/logo-yapmi.png">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script defer src="./assets/js/data.js"></script>
    <script defer src="./assets/js/report.js"></script>
    <script defer src="./assets/js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="YAPMI report home">
        <img src="./assets/img/logo-yapmi.png" alt="">
        <span>YAPMI <span class="brand-subtitle">ADMINISTRATION</span></span>
      </a>
      <span class="period-badge">REPORTING PERIOD <strong>2026–2027</strong></span>
    </header>

    <main class="page-content">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">OVERVIEW</p>
          <h1 id="page-title">Administrative report</h1>
          <p id="report-period" class="muted">Loading report…</p>
        </div>
        <p id="report-status" class="status-message" role="status" aria-live="polite">Loading report data…</p>
      </section>

      <section aria-label="Report summary">
        <div id="summary-cards" class="summary-grid"></div>
      </section>

      <section class="report-panel" aria-labelledby="details-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">DETAILS</p>
            <h2 id="details-title">Indicator progress</h2>
          </div>
          <span id="last-updated" class="muted"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Indicator</th>
                <th scope="col">Target</th>
                <th scope="col">Realized</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>
      </section>
      <p class="demo-note">The included report data is sample content intended to be replaced with approved figures.</p>
    </main>
  </body>
</html>
